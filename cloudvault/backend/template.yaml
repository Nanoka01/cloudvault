AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudVault — ระบบจัดเก็บและสำรองข้อมูล (API Gateway + Lambda Authorizer + Lambda + DynamoDB + S3)

Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: โดเมนของหน้าเว็บ (เช่น https://main.xxxxx.amplifyapp.com) ใส่ * ได้ตอน deploy ครั้งแรก
  JwtSecretParameterName:
    Type: String
    Default: cloudvault/jwt-secret
    Description: ชื่อ SSM SecureString ที่เก็บ JWT secret ไม่ต้องใส่ / นำหน้า (สร้างก่อน deploy ดู README)
  UserQuotaBytes:
    Type: Number
    Default: 5368709120
    Description: โควตาพื้นที่ต่อผู้ใช้ (ค่าเริ่มต้น 5 GB)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        BUCKET_NAME: !Ref FilesBucket
        JWT_SECRET_PARAM: !Sub '/${JwtSecretParameterName}'
        USER_QUOTA_BYTES: !Ref UserQuotaBytes
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # ---------------- DynamoDB (single-table) ----------------
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1 # บริษัทที่ผู้ใช้อยู่: GSI1PK = USER#uid
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: # ลบรายการอัปโหลดที่ไม่ได้ยืนยัน
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------- S3 ----------------
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [GET, POST, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # My Files: เวอร์ชันเก่าเก็บ 30 วัน แล้วลบ เพื่อไม่ให้ค่าใช้จ่ายสะสม
          - Id: users-old-versions
            Status: Enabled
            Prefix: users/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          # งานที่ Approve แล้ว: วันที่ 3 → Glacier Instant Retrieval, วันที่ 180 → Deep Archive
          # ไฟล์ไม่เกิน 128 KB อยู่ Standard ต่อ (Glacier คิดค่าขั้นต่ำ 128 KB ต่อไฟล์)
          - Id: approved-tiering
            Status: Enabled
            Prefix: companies/
            ObjectSizeGreaterThan: '131072'
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 3
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 180
          - Id: approved-old-versions
            Status: Enabled
            Prefix: companies/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true

  FilesBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub '${FilesBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---------------- API Gateway ----------------
  CloudVaultApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Header: Authorization
              ReauthorizeEvery: 300
      GatewayResponses: # ให้เบราว์เซอร์อ่าน error 401/403/5xx ได้ (มี CORS header)
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100

  # ---------------- Lambda ----------------
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/authorizer.handler
      Description: ตรวจ JWT ของทุก request
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref JwtSecretParameterName
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals: { 'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com' }

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/api.handler
      Description: API หลักของ CloudVault
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref JwtSecretParameterName
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals: { 'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com' }
            - Effect: Allow # เฉพาะ bucket ของระบบ (least privilege)
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
                - s3:PutObject
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:RestoreObject
              Resource: !Sub '${FilesBucket.Arn}/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:ListBucketVersions
              Resource: !GetAtt FilesBucket.Arn
      Events:
        Private:
          Type: Api
          Properties:
            RestApiId: !Ref CloudVaultApi
            Path: /{proxy+}
            Method: ANY
        AuthPublic:
          Type: Api
          Properties:
            RestApiId: !Ref CloudVaultApi
            Path: /auth/{proxy+}
            Method: ANY
            Auth:
              Authorizer: NONE
        SharePublic:
          Type: Api
          Properties:
            RestApiId: !Ref CloudVaultApi
            Path: /share/{token}
            Method: GET
            Auth:
              Authorizer: NONE

  PurgeTrashFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/purge.handler
      Description: ลบไฟล์ในถังขยะที่เกิน 30 วัน (วันละครั้ง)
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: [s3:DeleteObject, s3:DeleteObjectVersion]
              Resource: !Sub '${FilesBucket.Arn}/*'
            - Effect: Allow
              Action: [s3:ListBucket, s3:ListBucketVersions]
              Resource: !GetAtt FilesBucket.Arn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  # ---------------- CloudWatch ----------------
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda API มี error เกิน 5 ครั้งใน 5 นาที
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: ใส่ค่านี้เป็น VITE_API_URL ของหน้าเว็บ
    Value: !Sub 'https://${CloudVaultApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  BucketName:
    Value: !Ref FilesBucket
  TableName:
    Value: !Ref DataTable
